name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]

# 1. ADD THIS BLOCK: It cancels older queued builds automatically when you push new code
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # 2. ADD THIS LINE: If a server hangs, it force-quits after 10 minutes instead of stalling
    timeout-minutes: 10 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
